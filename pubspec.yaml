name: appzap_pos
description: "AppZap Universal POS - Production-ready Flutter POS Application for Laos"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.0
  
  # Local Database (Offline Mode)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0
  
  # Secure Storage
  flutter_secure_storage: ^9.2.2
  
  # WebSocket
  socket_io_client: ^2.0.3+1
  
  # UI Components
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  
  # Forms & Validation
  reactive_forms: ^17.0.1
  pin_code_fields: ^8.0.1
  
  # Barcode/QR
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0
  
  # Image Picker
  image_picker: ^1.1.2
  
  # Printing
  printing: ^5.13.4
  pdf: ^3.11.1
  flutter_blue_plus: ^1.32.12
  permission_handler: ^11.3.1
  network_info_plus: ^5.0.3
  image: ^4.1.0
  flutter_esc_pos_utils: ^1.0.1
  
  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.7
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  collection: ^1.19.0
  
  # Routing
  go_router: ^14.6.2
  
  # Logging
  logger: ^2.5.0
  
  # Loading/Animations
  flutter_spinkit: ^5.2.1
  lottie: ^3.1.3
  
  # Pull to Refresh
  pull_to_refresh: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Code Generation
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.2
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.22.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
